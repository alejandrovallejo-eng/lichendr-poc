# Local reproduction of LichenDR. Hosted Supabase is configured separately.
# CLI version used: 2.119.0. No project credentials belong in this file.
project_id = "lichendr-poc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Check the hosted server version before using schema diff against it.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# An installation starts empty: scientific observations are never seeded.
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"
# The private lichen-images bucket and its policies are created by migrations.

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
minimum_password_length = 8

[auth.rate_limit]
anonymous_users = 30

# Google is already configured in the hosted project. A separate local stack
# requires its own OAuth client and environment variables; never copy secrets here.
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[edge_runtime]
enabled = false

[analytics]
enabled = false
